<!doctype html>
<html lang="id" class="scheme-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curl Tester · Dashboard Server</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="min-h-screen">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-sky-600 focus:px-3 focus:py-2">Lewati ke konten</a>
  <header class="border-b border-slate-800 bg-slate-900">
    <nav aria-label="Navigasi utama" class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-2">
      <span class="font-mono text-sm font-semibold tracking-wide text-sky-400">dashboard-server</span>
      <a href="/sites" class="flex min-h-11 items-center border-b-2 border-transparent px-1 text-sm font-medium text-slate-300 hover:text-white">Sites</a>
      <a href="/curl-tester" aria-current="page" class="flex min-h-11 items-center border-b-2 border-sky-400 px-1 text-sm font-medium">Curl Tester</a>
      <a href="/audit-logs" class="flex min-h-11 items-center border-b-2 border-transparent px-1 text-sm font-medium text-slate-300 hover:text-white">Audit Logs</a>
      <span role="status" class="ml-auto flex items-center gap-2 text-xs text-slate-300">
        <span id="api-dot" class="size-2 rounded-full bg-slate-500" aria-hidden="true"></span>
        <span id="api-label">Memeriksa API…</span>
      </span>
    </nav>
  </header>

  <main id="main" class="mx-auto max-w-6xl px-4 py-6">
    <h1 class="mb-4 text-xl font-semibold">Curl Connectivity Tester</h1>
    <div id="error" role="alert" hidden class="mb-4 rounded-md border border-red-500 bg-red-950 px-4 py-3 text-sm text-red-100"></div>
    <p id="status" class="sr-only" aria-live="polite"></p>

    <div class="grid gap-4 lg:grid-cols-2">
      <form id="form" novalidate class="space-y-4 rounded-lg border border-slate-800 bg-slate-900 p-4">
        <div>
          <label for="profile" class="mb-1 block text-sm text-slate-300">Profil tersimpan</label>
          <select id="profile" class="field"><option value="">— pilih profil —</option></select>
        </div>
        <div>
          <label for="url" class="mb-1 block text-sm text-slate-300">URL target</label>
          <input id="url" class="field" autocomplete="off" spellcheck="false" placeholder="http://app-php83.local" aria-describedby="url-err">
          <p id="url-err" class="mt-1 min-h-5 text-sm text-red-300"></p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="ip" class="mb-1 block text-sm text-slate-300">IP resolusi manual (<code>--resolve</code>)</label>
            <input id="ip" class="field font-mono" autocomplete="off" spellcheck="false" placeholder="127.0.0.1" aria-describedby="ip-err">
            <p id="ip-err" class="mt-1 min-h-5 text-sm text-red-300"></p>
          </div>
          <div>
            <label for="port" class="mb-1 block text-sm text-slate-300">Port</label>
            <input id="port" type="number" min="1" max="65535" class="field" value="80" aria-describedby="port-err">
            <p id="port-err" class="mt-1 min-h-5 text-sm text-red-300"></p>
          </div>
        </div>
        <div>
          <label for="protocol" class="mb-1 block text-sm text-slate-300">Protokol</label>
          <select id="protocol" class="field"><option>HTTP</option><option>HTTPS</option></select>
        </div>
        <div>
          <label for="headers" class="mb-1 block text-sm text-slate-300">Custom headers (JSON)</label>
          <textarea id="headers" rows="4" class="field py-2 font-mono" spellcheck="false" placeholder='{"Host": "app-php83.local"}' aria-describedby="headers-err"></textarea>
          <p id="headers-err" class="mt-1 min-h-5 text-sm text-red-300"></p>
        </div>
        <button id="run" type="submit" class="btn btn-primary w-full">Jalankan Curl Test</button>

        <fieldset class="rounded-md border border-slate-700 p-3">
          <legend class="px-1 text-sm text-slate-300">Simpan sebagai profil</legend>
          <div class="flex flex-wrap items-end gap-2">
            <div class="min-w-48 flex-1">
              <label for="site" class="mb-1 block text-sm text-slate-300">Situs terkait</label>
              <select id="site" class="field"><option value="">— pilih situs —</option></select>
            </div>
            <button id="save-profile" type="button" class="btn">Simpan Profil</button>
          </div>
          <p id="site-err" class="mt-1 min-h-5 text-sm text-red-300"></p>
        </fieldset>
      </form>

      <section aria-labelledby="result-title" class="rounded-lg border border-slate-800 bg-slate-900 p-4">
        <h2 id="result-title" class="mb-3 text-base font-semibold">Hasil</h2>
        <p id="placeholder" class="text-sm text-slate-300">Masukkan parameter target di atas dan klik 'Jalankan Curl Test' untuk melihat hasil diagnostik.</p>
        <div id="result" hidden>
          <div class="mb-4 grid grid-cols-3 gap-3">
            <div class="rounded-md border border-slate-700 p-3"><p class="text-xs text-slate-400">HTTP Status</p><p id="m-status" class="mt-1"></p></div>
            <div class="rounded-md border border-slate-700 p-3"><p class="text-xs text-slate-400">TTFB</p><p id="m-ttfb" class="mt-1 text-lg font-semibold"></p></div>
            <div class="rounded-md border border-slate-700 p-3"><p class="text-xs text-slate-400">SSL / TLS</p><p id="m-ssl" class="mt-1 text-sm"></p></div>
          </div>
          <p id="m-error" hidden class="mb-3 rounded-md border border-red-500 bg-red-950 px-3 py-2 text-sm text-red-100"></p>
          <div role="tablist" aria-label="Detail respons" class="mb-2 flex gap-1">
            <button role="tab" id="tab-headers" aria-controls="panel-headers" aria-selected="true" class="btn" type="button">Raw Response Headers</button>
            <button role="tab" id="tab-command" aria-controls="panel-command" aria-selected="false" tabindex="-1" class="btn" type="button">Command Preview</button>
          </div>
          <pre id="panel-headers" role="tabpanel" aria-labelledby="tab-headers" tabindex="0" class="max-h-80 overflow-auto whitespace-pre-wrap break-all rounded-md bg-black p-3 font-mono text-xs text-slate-100"></pre>
          <pre id="panel-command" role="tabpanel" aria-labelledby="tab-command" tabindex="0" hidden class="max-h-80 overflow-auto whitespace-pre-wrap break-all rounded-md bg-black p-3 font-mono text-xs text-slate-100"></pre>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/static/curl.js"></script>
</body>
</html>
