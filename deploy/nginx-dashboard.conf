# Gateway Nginx untuk Dashboard Server.
# Pasang: salin ke /etc/nginx/sites-available/dashboard-server, ganti placeholder,
# lalu symlink ke sites-enabled. Buat akun: htpasswd -c /etc/nginx/.htpasswd <user>
server {
    listen 80;
    server_name dashboard.example.local;   # GANTI

    # Urutan: allow/deny (IP) dievaluasi sebelum auth_basic karena satisfy all.
    satisfy all;
    allow 192.168.1.0/24;                  # GANTI: subnet tepercaya
    allow 10.8.0.0/24;                     # GANTI: VPN internal
    deny all;

    auth_basic "Dashboard Server Internal Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Tulisan config bisa besar; batasi tetap wajar.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
