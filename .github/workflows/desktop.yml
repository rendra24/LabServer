name: desktop
# Hanya macOS (pemakaian internal, tanpa code signing). Rilis: dorong tag `desktop-v<versi>`.
on:
  push:
    branches: ["**"]
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test            # tes integrasi (sshd/nginx/prometheus) dilewati otomatis tanpa container
      - name: Versi tag harus sama dengan package.json
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "desktop-v$v" ] || { echo "Tag $GITHUB_REF_NAME != desktop-v$v"; exit 1; }
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-server-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-server-macos
      - name: Checksum
        run: shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          Installer macOS (arm64 = Apple Silicon, tanpa akhiran = Intel). Belum ditandatangani/dinotarisasi (pemakaian internal).

          Saat pertama dibuka: klik kanan aplikasi → Open → Open. Jika masih diblokir:
          `xattr -dr com.apple.quarantine "/Applications/Dashboard Server.app"`

          Verifikasi unduhan dengan `shasum -a 256 -c SHA256SUMS.txt`.
          NOTES
          gh release create "$TAG" *.dmg SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
